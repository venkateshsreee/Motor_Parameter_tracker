<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Motor Parameter Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --steel:#DDE2E5; --plate:#F5F6F4; --ink:#1E2A31; --muted:#5B6870;
  --line:#AEB8BE; --blue:#245A8C; --amber:#D99A00; --down:#B5412F; --up:#2E7D4F;
  --rivet:#9AA4AA;
  --cond:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --steel:#1A2126; --plate:#252E34; --ink:#E4E8EA; --muted:#9AA6AD;
    --line:#46525A; --blue:#6FA3D6; --amber:#F0B429; --down:#E07763; --up:#5DBB85; --rivet:#55616A;
  }
}
:root[data-theme="dark"]{
  --steel:#1A2126; --plate:#252E34; --ink:#E4E8EA; --muted:#9AA6AD;
  --line:#46525A; --blue:#6FA3D6; --amber:#F0B429; --down:#E07763; --up:#5DBB85; --rivet:#55616A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--steel);color:var(--ink);font:16px/1.5 var(--body)}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px 64px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:24px}
h1{font-family:var(--cond);font-weight:700;font-size:2rem;line-height:1.1;margin:0;letter-spacing:.01em}
.sub{color:var(--muted);margin:4px 0 0;font-size:.95rem}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--plate);border-radius:4px;padding:8px 14px}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
button.ghost{background:transparent}
button.danger{color:var(--down);border-color:transparent;background:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
input{background:var(--steel);border:1px solid var(--line);border-radius:3px;padding:7px 9px;width:100%;min-width:0}
.new-motor{display:flex;gap:8px;margin-bottom:28px}
.new-motor input{flex:1;background:var(--plate)}
.tools{display:flex;gap:8px;flex-wrap:wrap}

/* Motor card styled as a rating plate */
.plate{position:relative;background:var(--plate);border:2px solid var(--line);border-radius:6px;
  padding:22px 26px 20px;margin-bottom:24px}
.plate::before,.plate::after,.plate .r1,.plate .r2{content:"";position:absolute;width:10px;height:10px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,var(--plate),var(--rivet) 70%);border:1px solid var(--rivet)}
.plate::before{top:8px;left:8px}.plate::after{top:8px;right:8px}
.plate .r1{bottom:8px;left:8px}.plate .r2{bottom:8px;right:8px}
.plate-head{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px}
.plate-name{font-family:var(--cond);font-weight:700;font-size:1.6rem;line-height:1.15;margin:0;
  text-transform:none;word-break:break-word}
.plate-name input{font-family:var(--cond);font-weight:700;font-size:1.4rem}
.meta{color:var(--muted);font-size:.85rem}
.body{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:start}
@media (max-width:680px){.body{grid-template-columns:1fr}.qrbox{justify-self:start}}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:440px}
th{font-family:var(--cond);font-weight:500;text-align:left;color:var(--muted);font-size:.9rem;padding:4px 6px;border-bottom:1px solid var(--line)}
td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.name{font-weight:600;min-width:120px}
td.delta{font-family:var(--cond);font-size:.95rem;white-space:nowrap;min-width:70px}
.up{color:var(--up)}.down{color:var(--down)}.same{color:var(--muted)}
tr.changed td.name{box-shadow:inset 4px 0 0 var(--amber);padding-left:10px}
.add-param{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin-top:12px}
@media (max-width:520px){.add-param{grid-template-columns:1fr 1fr}.add-param input:first-child{grid-column:1/-1}}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.empty{color:var(--muted);padding:10px 0;margin:0}

.qrbox{text-align:center;background:#fff;padding:10px;border:1px solid var(--line);border-radius:4px}
.qrbox .qr{width:150px;height:150px}
.qrbox .qr img,.qrbox .qr canvas{width:150px!important;height:150px!important}
.qrbox p{margin:6px 0 0;font-size:.8rem;color:#5B6870}
.qrbox button{margin-top:6px;font-size:.8rem;padding:4px 8px;color:#1E2A31;background:#fff}

.banner{background:var(--plate);border-left:5px solid var(--amber);padding:12px 16px;margin-bottom:20px;border-radius:3px}
.banner p{margin:0 0 8px}
.zero{text-align:center;padding:48px 16px;color:var(--muted);border:2px dashed var(--line);border-radius:6px}
.adminbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font-family:var(--cond);font-size:.85rem;background:var(--amber);color:#1E2A31;padding:2px 8px;border-radius:3px}
.backlink{display:inline-block;margin-bottom:16px;color:var(--blue)}
.single .plate{border-width:3px}
.pinline{font-family:Consolas,monospace;font-size:.8rem;word-break:break-all;background:var(--steel);padding:8px;border-radius:3px;user-select:all}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--plate);padding:10px 16px;border-radius:4px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media print{.tools,.new-motor,.add-param,.actions,.qrbox button,.danger{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Motor Parameter Tracker</h1>
      <p class="sub" id="subline">Record current and previous readings for each motor. Scan a motor's QR to view or edit it on another device.</p>
    </div>
    <div class="adminbar">
      <span class="badge" id="adminBadge" hidden>Admin</span>
      <button id="exportBtn" class="ghost" hidden>Export backup</button>
      <button id="importBtn" class="ghost" hidden>Import backup</button>
      <button id="pinBtn" class="ghost" hidden>Change PIN</button>
      <button id="adminBtn" class="ghost">Admin login</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
  </header>

  <div id="banner"></div>
  <div id="pinPanel"></div>

  <form class="new-motor" id="newMotorForm" hidden>
    <input id="newMotorName" placeholder="Motor name, e.g. Flyer Frame spindle M1" aria-label="Motor name" required>
    <button class="primary" type="submit">Create motor</button>
  </form>

  <main id="list"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  // ===== ADMIN PIN =====
  // SHA-256 hash of the admin PIN. Default PIN is 1234.
  // To change: log in as admin, select "Change PIN", and paste the new line here.
  const ADMIN_PIN_HASH = "03752e796bffa919c2198c1b067fdb88026bea3a9dec4f6cbd9a17be9d9ee0a0";

  const KEY = "motorTracker.v1";
  let motors = load();
  let isAdmin = (()=>{ try{ return sessionStorage.getItem("motorTracker.admin")==="1"; }catch(e){ return false; } })();
  let singleId = null;   // set when the page is opened from a motor QR

  async function sha256(t){
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
  }

  // ---------- storage ----------
  function load(){
    try{ const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : []; }
    catch(e){ return []; }
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(motors)); }
    catch(e){ toast("Could not save on this device — storage is blocked."); }
  }
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  const now = () => new Date().toISOString();

  // ---------- URL encoding for QR (UTF-8 safe base64url) ----------
  function encodeMotor(m){
    const slim = {i:m.id, n:m.name, u:m.updated, p:m.params.map(p=>[p.name,p.current,p.previous])};
    const bytes = new TextEncoder().encode(JSON.stringify(slim));
    let bin = ""; bytes.forEach(b=>bin += String.fromCharCode(b));
    return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  }
  function decodeMotor(s){
    s = s.replace(/-/g,"+").replace(/_/g,"/");
    while(s.length % 4) s += "=";
    const bin = atob(s);
    const bytes = Uint8Array.from(bin, c=>c.charCodeAt(0));
    const o = JSON.parse(new TextDecoder().decode(bytes));
    return {id:o.i, name:o.n, updated:o.u, params:(o.p||[]).map(a=>({id:uid(),name:a[0],current:a[1],previous:a[2]}))};
  }
  function motorUrl(m){
    return location.origin + location.pathname + "#m=" + encodeMotor(m);
  }

  // ---------- helpers ----------
  const $ = s => document.querySelector(s);
  function el(tag, attrs={}, ...kids){
    const e = document.createElement(tag);
    for(const [k,v] of Object.entries(attrs)){
      if(k==="class") e.className=v;
      else if(k.startsWith("on")) e.addEventListener(k.slice(2),v);
      else if(v!==undefined && v!==null) e.setAttribute(k,v);
    }
    kids.flat().forEach(k=>e.append(k instanceof Node ? k : document.createTextNode(k)));
    return e;
  }
  function toast(msg){
    const t=$("#toast"); t.textContent=msg; t.classList.add("show");
    clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2200);
  }
  function delta(cur, prev){
    const a=parseFloat(cur), b=parseFloat(prev);
    if(cur===""||prev===""||isNaN(a)||isNaN(b)) return {txt: cur!==prev && cur!=="" && prev!=="" ? "changed" : "", cls: cur!==prev ? "same":""};
    const d=a-b;
    if(d===0) return {txt:"no change",cls:"same"};
    const pct = b!==0 ? ` (${(d/Math.abs(b)*100).toFixed(1)}%)` : "";
    return {txt:(d>0?"+":"")+ +d.toFixed(4) + pct, cls:d>0?"up":"down"};
  }
  const fmtDate = iso => iso ? new Date(iso).toLocaleString() : "—";

  // ---------- actions ----------
  function touch(m){
    m.updated = now(); save();
    if(singleId===m.id) history.replaceState(null,"","#m="+encodeMotor(m));
    render();
  }
  function findMotor(id){ return motors.find(m=>m.id===id); }

  $("#newMotorForm").addEventListener("submit", e=>{
    e.preventDefault();
    const name = $("#newMotorName").value.trim();
    if(!name) return;
    motors.unshift({id:uid(), name, created:now(), updated:now(), params:[]});
    $("#newMotorName").value="";
    save(); render(); toast("Motor created");
  });

  // ---------- render ----------
  function render(){
    $("#adminBadge").hidden = !isAdmin;
    ["#exportBtn","#importBtn","#pinBtn"].forEach(id=>$(id).hidden = !isAdmin);
    $("#adminBtn").textContent = isAdmin ? "Log out" : "Admin login";
    $("#newMotorForm").hidden = !isAdmin || !!singleId;
    if(!isAdmin) $("#pinPanel").innerHTML="";

    const list = $("#list"); list.innerHTML="";
    document.body.classList.toggle("single", !!singleId);

    if(singleId){
      const m = findMotor(singleId);
      $("#subline").textContent = "Edit the values below. Changes are saved on this device.";
      if(isAdmin) list.append(el("a",{href:location.pathname,class:"backlink"},"Show all motors"));
      if(m) list.append(plate(m));
      return;
    }

    $("#subline").textContent = isAdmin
      ? "Create motors, set up their parameters, and print each motor's QR."
      : "Record current and previous readings for each motor.";
    if(!motors.length){
      list.append(el("div",{class:"zero"},
        el("p",{},"No motors yet."),
        el("p",{}, isAdmin ? "Type a motor name above and select Create motor to start tracking."
                           : "An admin needs to create motors first. Select Admin login to add one.")));
      return;
    }
    motors.forEach(m=>list.append(plate(m)));
  }

  function plate(m){
    const card = el("section",{class:"plate","aria-label":m.name});
    card.append(el("span",{class:"r1"}),el("span",{class:"r2"}));

    // header with rename
    const title = el("h2",{class:"plate-name"}, m.name);
    const head = el("div",{class:"plate-head"},
      el("div",{}, title, el("div",{class:"meta"}, `${m.params.length} parameter${m.params.length===1?"":"s"}, last updated ${fmtDate(m.updated)}`)),
      !isAdmin ? "" : el("div",{class:"tools"},
        el("button",{class:"ghost",onclick:()=>{
          const n = prompt("Rename motor", m.name);
          if(n && n.trim()){ m.name=n.trim(); touch(m); }
        }},"Rename"),
        el("button",{class:"danger",onclick:()=>{
          if(confirm(`Delete "${m.name}" and all its parameters?`)){
            motors = motors.filter(x=>x.id!==m.id); save();
            if(singleId===m.id){ singleId=null; history.replaceState(null,"",location.pathname); }
            render(); toast("Motor deleted");
          }
        }},"Delete motor"))
    );
    card.append(head);

    // table
    const left = el("div",{});
    if(!m.params.length){
      left.append(el("p",{class:"empty"}, isAdmin ? "No parameters yet. Add one below, e.g. Rated current, Rs, Ld, Lq, Kv."
                                                   : "No parameters yet. An admin needs to add them."));
    } else {
      const tbody = el("tbody");
      m.params.forEach(p=>{
        const dEl = el("td",{class:"delta"});
        const row = el("tr",{});
        const update = ()=>{
          const d=delta(p.current,p.previous);
          dEl.textContent=d.txt; dEl.className="delta "+d.cls;
          row.classList.toggle("changed", p.current!==p.previous && p.previous!=="" );
        };
        const cur = el("input",{value:p.current,"aria-label":`${p.name} current value`,inputmode:"decimal"});
        const prev = el("input",{value:p.previous,"aria-label":`${p.name} previous value`,inputmode:"decimal"});
        cur.addEventListener("input",()=>{p.current=cur.value; update();});
        prev.addEventListener("input",()=>{p.previous=prev.value; update();});
        cur.addEventListener("change",()=>touch(m));
        prev.addEventListener("change",()=>touch(m));
        row.append(
          el("td",{class:"name"},p.name),
          el("td",{},cur), el("td",{},prev), dEl,
          el("td",{}, !isAdmin ? "" : el("button",{class:"danger","aria-label":`Remove ${p.name}`,onclick:()=>{
            if(confirm(`Remove "${p.name}"?`)){ m.params = m.params.filter(x=>x.id!==p.id); touch(m); }
          }},"Remove"))
        );
        update();
        tbody.append(row);
      });
      left.append(el("div",{class:"tablewrap"},
        el("table",{},
          el("thead",{},el("tr",{},
            el("th",{},"Parameter"),el("th",{},"Current value"),el("th",{},"Previous value"),el("th",{},"Change"),el("th",{},""))),
          tbody)));
    }

    // add parameter
    const nIn = el("input",{placeholder:"Parameter name","aria-label":"Parameter name"});
    const cIn = el("input",{placeholder:"Current","aria-label":"Current value",inputmode:"decimal"});
    const pIn = el("input",{placeholder:"Previous","aria-label":"Previous value",inputmode:"decimal"});
    const add = ()=>{
      const name=nIn.value.trim();
      if(!name){ nIn.focus(); toast("Enter a parameter name first"); return; }
      m.params.push({id:uid(),name,current:cIn.value.trim(),previous:pIn.value.trim()});
      touch(m); toast("Parameter added");
    };
    [nIn,cIn,pIn].forEach(i=>i.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();add();}}));
    if(isAdmin) left.append(el("div",{class:"add-param"}, nIn, cIn, pIn, el("button",{class:"primary",onclick:add},"Add parameter")));

    if(m.params.length){
      left.append(el("div",{class:"actions"},
        el("button",{onclick:()=>{
          if(!confirm("Copy every current value into Previous, so you can enter a fresh reading?")) return;
          m.params.forEach(p=>{p.previous=p.current;});
          touch(m); toast("Current values moved to Previous");
        }},"Start new reading")));
    }

    // QR
    const qrDiv = el("div",{class:"qr",role:"img","aria-label":`QR code for ${m.name}`});
    const url = motorUrl(m);
    const qrbox = el("div",{class:"qrbox"}, qrDiv, el("p",{}, singleId ? "Scan to open these values" : "Scan to view and edit"),
      el("button",{onclick:()=>{
        navigator.clipboard?.writeText(url).then(()=>toast("Link copied"),()=>prompt("Copy this link",url));
      }},"Copy link"),
      " ",
      el("button",{onclick:()=>downloadQR(qrDiv, m.name)},"Save QR"));
    try{
      new QRCode(qrDiv,{text:url,width:300,height:300,correctLevel:QRCode.CorrectLevel.L});
    }catch(e){
      qrDiv.textContent="Too much data for one QR. Remove some parameters or shorten names.";
      qrDiv.style.cssText="width:150px;font-size:.8rem;color:#B5412F";
    }

    card.append(el("div",{class:"body"}, left, qrbox));
    return card;
  }

  function downloadQR(qrDiv, name){
    const img = qrDiv.querySelector("img"), cv = qrDiv.querySelector("canvas");
    const src = cv ? cv.toDataURL("image/png") : img?.src;
    if(!src) return;
    const a = el("a",{href:src,download:`QR_${name.replace(/[^\w-]+/g,"_")}.png`});
    document.body.append(a); a.click(); a.remove();
  }

  // ---------- scanned link handling ----------
  function handleHash(){
    const banner = $("#banner"); banner.innerHTML="";
    const mm = location.hash.match(/^#m=(.+)$/);
    if(!mm){ singleId=null; return; }
    let scanned;
    try{ scanned = decodeMotor(mm[1]); }
    catch(e){
      singleId=null;
      banner.append(el("div",{class:"banner"},el("p",{},"This QR link is damaged and could not be read. Scan it again or ask for a fresh code.")));
      return;
    }
    singleId = scanned.id;
    const existing = findMotor(scanned.id);
    if(!existing){
      motors.unshift({...scanned, created:now()});
      save();
    } else if((scanned.updated||"") > (existing.updated||"")){
      // QR is newer than this device: take the QR values
      Object.assign(existing,{name:scanned.name,params:scanned.params,updated:scanned.updated});
      save();
    } else if((existing.updated||"") > (scanned.updated||"")){
      banner.append(el("div",{class:"banner"},
        el("p",{},`Showing the newer values saved on this device (${fmtDate(existing.updated)}). The printed QR holds older values from ${fmtDate(scanned.updated)}.`)));
      history.replaceState(null,"","#m="+encodeMotor(existing));
    }
  }

  // ---------- backup ----------
  $("#exportBtn").addEventListener("click",()=>{
    const blob = new Blob([JSON.stringify(motors,null,2)],{type:"application/json"});
    const a = el("a",{href:URL.createObjectURL(blob),download:`motor-parameters-${new Date().toISOString().slice(0,10)}.json`});
    document.body.append(a); a.click(); a.remove();
  });
  $("#importBtn").addEventListener("click",()=>$("#importFile").click());
  $("#importFile").addEventListener("change",async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{
      const data = JSON.parse(await f.text());
      if(!Array.isArray(data)) throw 0;
      if(!confirm(`Replace the ${motors.length} motor(s) on this device with ${data.length} from the backup?`)) return;
      motors = data; save(); render(); toast("Backup imported");
    }catch(_){ toast("That file isn't a valid tracker backup."); }
    e.target.value="";
  });

  $("#adminBtn").addEventListener("click", async ()=>{
    if(isAdmin){
      isAdmin=false; try{sessionStorage.removeItem("motorTracker.admin");}catch(e){}
      render(); toast("Logged out"); return;
    }
    const pin = prompt("Enter admin PIN");
    if(pin===null) return;
    if(await sha256(pin) === ADMIN_PIN_HASH){
      isAdmin=true; try{sessionStorage.setItem("motorTracker.admin","1");}catch(e){}
      render(); toast("Logged in as admin");
    } else toast("Wrong PIN");
  });
  $("#pinBtn").addEventListener("click", async ()=>{
    const p1 = prompt("New admin PIN"); if(!p1) return;
    const p2 = prompt("Type the new PIN again"); if(p1!==p2){ toast("PINs don't match"); return; }
    const line = `const ADMIN_PIN_HASH = "${await sha256(p1)}";`;
    $("#pinPanel").innerHTML="";
    $("#pinPanel").append(el("div",{class:"banner"},
      el("p",{},"To change the PIN on every device, open index.html on GitHub, replace the ADMIN_PIN_HASH line near the top of the script with this line, and commit:"),
      el("div",{class:"pinline"},line),
      el("p",{style:"margin-top:8px"}, el("button",{onclick:()=>{navigator.clipboard?.writeText(line).then(()=>toast("Line copied"));}},"Copy line"), " ",
        el("button",{class:"ghost",onclick:()=>{$("#pinPanel").innerHTML="";}},"Close"))));
  });

  window.addEventListener("hashchange",()=>{handleHash();render();});
  handleHash();
  render();
})();
</script>
</body>
</html>
